# 개발/테스트(dev) 프로필 전용 설정.
#
# 목적: 카카오 OAuth 없이 테스트 계정으로 로그인해 실시간 입찰 등을 검증하기 위한 프로필.
#       이 프로필이 활성일 때만 DevAuthController(@Profile("dev"))가 등록되어
#       POST /api/v1/auth/dev/login 이 열린다.
#
# 활성화(중요): DB/JWT 시크릿을 가진 secret 프로필과 함께 켜야 한다.
#   Windows: ./gradlew.bat bootRun --args='--spring.profiles.active=secret,dev'
#   환경변수: SPRING_PROFILES_ACTIVE=secret,dev
#
# 주의: 운영(prod)에서는 절대 dev 프로필을 활성화하지 말 것(테스트 로그인이 열린다).

# 테스트 편의를 위해 실행되는 SQL을 콘솔에 출력(선택 사항).
logging:
  level:
    org.hibernate.SQL: debug
