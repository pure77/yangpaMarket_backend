spring.application.name=yanpaMarket_backend

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 이미지 로컬 업로드 설정 (S3 미사용, storage_provider=LOCAL)
app.upload.dir=${UPLOAD_DIR:./uploads}
app.upload.public-base-url=${UPLOAD_PUBLIC_BASE_URL:http://localhost:8080/uploads}
app.upload.max-file-size-bytes=${UPLOAD_MAX_BYTES:10485760}

# 경매 공개 유예(분). 등록 후 이 시간 뒤 공개 목록/입찰 노출.
app.auction.publish-delay-minutes=${AUCTION_PUBLISH_DELAY_MINUTES:5}
