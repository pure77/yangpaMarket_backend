spring.application.name=yanpaMarket_backend

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# CORS 허용 출처(쉼표 구분). WebSocketConfig와 SecurityConfig가 이 값을 함께 쓴다.
# 배포 시 CORS_ALLOWED_ORIGINS 환경변수로 주입한다. (prod 프로필은 기본값 없이 필수로 요구)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 이미지 로컬 업로드 설정 (S3 미사용, storage_provider=LOCAL)
app.upload.dir=${UPLOAD_DIR:./uploads}
app.upload.public-base-url=${UPLOAD_PUBLIC_BASE_URL:http://localhost:8080/uploads}
app.upload.max-file-size-bytes=${UPLOAD_MAX_BYTES:10485760}

# 경매 공개 유예(초). 등록 후 이 시간 뒤 공개 목록/입찰 노출. (테스트용 10초)
app.auction.publish-delay-seconds=${AUCTION_PUBLISH_DELAY_SECONDS:10}
