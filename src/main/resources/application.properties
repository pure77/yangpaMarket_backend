spring.application.name=yanpaMarket_backend

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# [기존 DB 대응] 지금까지 Flyway가 실제로는 돌지 않아, 기존 개발 DB는 db/mysql/init/001_schema.sql로 만들어졌고 이력 테이블이 없다.
#   이력 없이 테이블만 있는 DB면 Flyway가 기동을 막으므로, 그런 DB는 "V4까지 적용됨"으로 표시(baseline)하고 넘어간다.
#   빈 DB에는 영향 없음(V1부터 정상 적용). 새 스키마 변경은 V5__...부터 추가한다.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=4

# CORS 허용 출처(쉼표 구분). WebSocketConfig와 SecurityConfig가 이 값을 함께 쓴다.
# 배포 시 CORS_ALLOWED_ORIGINS 환경변수로 주입한다. (prod 프로필은 기본값 없이 필수로 요구)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 이미지 로컬 업로드 설정 (S3 미사용, storage_provider=LOCAL)
app.upload.dir=${UPLOAD_DIR:./uploads}
app.upload.public-base-url=${UPLOAD_PUBLIC_BASE_URL:http://localhost:8080/uploads}
app.upload.max-file-size-bytes=${UPLOAD_MAX_BYTES:10485760}

# 경매 공개 유예(초). 등록 후 이 시간 뒤 공개 목록/입찰 노출. (기본 60초)
app.auction.publish-delay-seconds=${AUCTION_PUBLISH_DELAY_SECONDS:60}

# ── Redis (입찰 사전 거절용 현재가 사본) ──────────────────────────────
# 접속 정보는 환경변수로 받는다. ElastiCache 등으로 옮겨도 코드는 그대로다.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
# [짧은 타임아웃] 죽은 Redis보다 느린 Redis가 더 위험하다 — 기다리는 동안 Tomcat 스레드가 묶인다.
spring.data.redis.timeout=50ms
spring.data.redis.connect-timeout=200ms
# Redis 리포지토리는 쓰지 않는다(JPA와 섞이면 Spring Data가 리포지토리 소유권을 따지는 로그를 남긴다).
spring.data.redis.repositories.enabled=false
# [비상 스위치] false면 NoOpBidPriceGuard — 사전 거절을 끄고 기존 락 경로만 쓴다. 재시작 시 반영.
app.bid.precheck.enabled=${BID_PRECHECK_ENABLED:true}
