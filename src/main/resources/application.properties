spring.application.name=yanpaMarket_backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/yanpa_market?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET:change-this-secret-key-at-least-32-bytes-long}
app.jwt.access-expiration-seconds=${JWT_ACCESS_TTL_SECONDS:3600}
app.jwt.refresh-expiration-seconds=${JWT_REFRESH_TTL_SECONDS:604800}
app.jwt.signup-expiration-seconds=${JWT_SIGNUP_TTL_SECONDS:600}

app.kakao.client-id=${KAKAO_CLIENT_ID:}
app.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
app.kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8080/api/v1/auth/kakao/callback}
app.kakao.auth-uri=${KAKAO_AUTH_URI:https://kauth.kakao.com/oauth/authorize}
app.kakao.token-uri=${KAKAO_TOKEN_URI:https://kauth.kakao.com/oauth/token}
app.kakao.user-info-uri=${KAKAO_USER_INFO_URI:https://kapi.kakao.com/v2/user/me}
