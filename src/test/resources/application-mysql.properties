# ─────────────────────────────────────────────────────────────────────────────
# 부하 테스트 전용 MySQL 프로필.
#
# [왜 있나] test 프로필은 H2 인메모리라 fsync가 없어 트랜잭션이 실제보다 훨씬 빠르다.
#   그래서 "락이 병목인가 DB가 병목인가"를 판단하면 항상 락 쪽으로 기울어 보인다.
#   진짜 판단은 MySQL로 붙여서 해야 한다.
#
# [환경변수] 메인 앱과 똑같은 변수를 그대로 쓴다 — DB_URL / DB_USERNAME / DB_PASSWORD.
#   (application-secret.yml, run_backend.bat과 동일한 이름)
#   단, run_backend.bat의 set은 그 배치 프로세스 안에서만 유효하므로 셸에서 따로 잡아야 한다.
#
#   PowerShell:
#     $env:DB_USERNAME="root"; $env:DB_PASSWORD="비밀번호"
#     .\gradlew.bat test --tests "*HotAuctionLoadTest*" -Dloadtest=true -Dload.profile=mysql
#
# [DB 이름만 다르다 — 매우 중요]
#   DB_URL은 그대로 받되 데이터베이스 이름 뒤에 "_loadtest"를 붙여 옆에 새 DB를 만든다.
#     DB_URL = jdbc:mysql://localhost:3306/yanpa_market
#     실제 접속 →           jdbc:mysql://localhost:3306/yanpa_market_loadtest
#   이 테스트는 deleteAll을 호출하고 ddl-auto=create-drop이라 개발 DB에 붙으면 데이터가 전부 사라진다.
#   변환은 HotAuctionLoadTest.resolveLoadTestDatabase()가 @DynamicPropertySource로 처리하고,
#   assertSafeDatabase()가 실행 직전에 한 번 더 확인한다(이름에 loadtest가 없으면 즉시 실패).
#   특정 URL을 직접 지정해야 하면 LOAD_DB_URL로 덮어쓸 수 있다.
# ─────────────────────────────────────────────────────────────────────────────

# [계정] 메인과 동일한 변수명. 같은 MySQL 서버, 같은 계정이므로 분리할 이유가 없다.
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# [URL] 아래는 DB_URL이 아예 없을 때만 쓰이는 기본값이다.
# 실제로는 @DynamicPropertySource가 DB_URL에서 _loadtest 이름을 만들어 덮어쓴다.
spring.datasource.url=${LOAD_DB_URL:jdbc:mysql://localhost:3306/yanpa_market_loadtest?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}

# 스키마는 JPA가 만든다(Flyway는 base 설정에서 이미 꺼져 있다).
# 부하 경로의 쿼리는 PK 조회 + public_id 유니크 조회뿐이라 엔티티 매핑만으로 인덱스가 충분하다.
spring.jpa.hibernate.ddl-auto=create-drop

# [커넥션 풀 크기] 기본 10 — Spring Boot 기본값과 같다.
# 풀 고갈이 재현되는지 보는 것이 이 테스트의 목적 중 하나라 일부러 기본값에서 시작한다.
#
# 값을 바꿔가며 비교하려면 파일을 고치지 말고 VM 옵션으로 넘긴다:
#   -Dload.poolSize=30
#
# 실측 예 (구독자 100 / 입찰자 100 / 60초, MySQL):
#   풀 10 → active 9.6/10, pending 평균 64.3, 대기 발생 구간 96.6% → 풀 고갈
#           그 대기가 "락 밖 조회 2회"에서 발생해 (a) 진입·조회가 92%로 부풀었다
spring.datasource.hikari.maximum-pool-size=${load.poolSize:10}
