spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

app.upload.dir=build/test-uploads
app.upload.public-base-url=http://localhost:8080/uploads
app.upload.max-file-size-bytes=10485760

app.jwt.secret=test-secret-key-at-least-32-characters
app.jwt.access-expiration-seconds=3600
app.jwt.refresh-expiration-seconds=604800
app.jwt.signup-expiration-seconds=600

app.kakao.client-id=test-client-id
app.kakao.client-secret=test-client-secret
app.kakao.redirect-uri=http://localhost:8080/api/v1/auth/kakao/callback
app.kakao.auth-uri=https://kauth.kakao.com/oauth/authorize
app.kakao.token-uri=https://kauth.kakao.com/oauth/token
app.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me

# [Redis] 기본은 사전 거절 꺼짐 — 기존 테스트가 Docker 없이 지금처럼 돈다.
#   Redis 테스트는 RedisTestSupport를 상속해 켠다(컨테이너 주소도 거기서 넣는다).
#   이 파일은 main의 application.properties를 가리므로 타임아웃도 여기 다시 적는다.
app.bid.precheck.enabled=false
spring.data.redis.timeout=50ms
spring.data.redis.connect-timeout=200ms
spring.data.redis.repositories.enabled=false
