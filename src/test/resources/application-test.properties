spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

app.jwt.secret=test-secret-key-at-least-32-characters
app.jwt.access-expiration-seconds=3600
app.jwt.refresh-expiration-seconds=604800
app.jwt.signup-expiration-seconds=600

app.kakao.client-id=test-client-id
app.kakao.client-secret=test-client-secret
app.kakao.redirect-uri=http://localhost:8080/api/v1/auth/kakao/callback
app.kakao.auth-uri=https://kauth.kakao.com/oauth/authorize
app.kakao.token-uri=https://kauth.kakao.com/oauth/token
app.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
