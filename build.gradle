plugins {
	id 'java'
	// [4.1.2] 4.0의 무료(OSS) 지원이 2026-12-31에 끝난다. 4.1은 2027-07-31까지 지원된다.
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		// [Java 25 = 최신 LTS] 18은 2022-09에 지원이 끝난 비 LTS라 보안 패치가 없다.
		//   Spring Boot 4.0.x·4.1.x 모두 Java 17~27을 지원한다. 25부터 sealed 타입 switch 패턴 매칭을 쓴다.
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

// [Mockito 에이전트] Java 21+는 테스트 중에 에이전트를 "동적으로" 붙이면 경고를 내고, 향후 JDK는 기본 차단한다.
//   그러면 @MockitoSpyBean 같은 인라인 목이 깨질 수 있다. Mockito 공식 권장대로 JVM 시작 시 -javaagent로 붙인다.
configurations {
	mockitoAgent
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// [캐시] Spring Cache 추상화(@Cacheable) + 저장소 Caffeine(서버 메모리).
	// 입찰 경로의 락 밖 조회(경매 ID, 사용자 요약)를 캐시해 DB 커넥션 획득을 줄인다. 설정은 CacheConfig.
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'com.github.ben-manes.caffeine:caffeine'
	// [Redis] 입찰 사전 거절용 현재가 사본. 클라이언트는 Lettuce(스타터 기본). 설정은 RedisConfig / application.properties.
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	// [Redisson] 2단계 분산 락(DistributedBidLock) 전용. 핵심 라이브러리만 쓴다 — 스타터는 lettuce-core를 빼고
	//   Redis 연결을 바꿔, 사전 거절(Lettuce)의 끊김 즉시 실패·50ms 타임아웃 설정이 사라지기 때문이다. 설정은 RedissonConfig.
	implementation 'org.redisson:redisson:4.8.0'
	// [Resilience4j] DistributedBidLock의 차단기(느리거나 실패하는 Redis를 잠시 건너뜀). 스타터가 아닌 순수 Java 모듈만 쓴다.
	implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.4.0'
	implementation 'org.flywaydb:flyway-core'
	implementation 'com.github.f4b6a3:ulid-creator:5.2.3'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	implementation platform('software.amazon.awssdk:bom:2.28.16')
	implementation 'software.amazon.awssdk:s3'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	mockitoAgent('org.mockito:mockito-core') { transitive = false } // 버전은 Spring Boot BOM
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'com.h2database:h2'
	// [Testcontainers] Redis 테스트는 진짜 Redis 컨테이너에서 돈다(Lua 원자성·타임아웃 동작을 검증해야 해서). Docker 필요.
	testImplementation 'org.testcontainers:testcontainers'
	// [서버 2대 재현 테스트] 두 앱이 함께 쓰는 MySQL 컨테이너. 버전은 Spring Boot BOM(Testcontainers 2.0.5).
	testImplementation 'org.testcontainers:testcontainers-mysql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

}

tasks.named('test') {
	useJUnitPlatform()
	jvmArgs += "-javaagent:${configurations.mockitoAgent.asPath}"

	// [부하 테스트 스위치] HotAuctionLoadTest는 평소엔 건너뛴다(수십 초 걸림).
	// 돌릴 때만: ./gradlew.bat test --tests '*HotAuctionLoadTest*' -Dloadtest=true
	// 파라미터도 같은 방식으로 넘긴다: -Dload.subscribers=100 -Dload.bidders=20 -Dload.seconds=60
	// load.auctions(인기 경매 수) / load.auctionSweep(경매 수 스윕, 예: 1,3,5)도 같은 방식.
	// load.bidders / load.subscribers 는 "경매당" 값이다.
	// load.precheck=on|off(기본 off): 입찰 사전 거절(Redis) A/B 비교. on이면 docker-compose Redis의 DB 15를 비우고 쓴다.
	// load.priceReadAt=send|decide(기본 send): decide면 금액을 정한 순간의 가격으로, 생각 시간 뒤에 보낸다(현실적 부하).
	// multiserver=true: 서버 2대 재현 테스트(MultiServerBidTest) 실행. Docker 필요.
	// multiserver.distributedLock=false: 서버 2대 테스트를 분산 락 없이(도입 전 상태로) 실행 — 비교용
	// multiserver.load=true: 서버 2대 부하 측정(MultiServerLoadTest) — 사전 거절 켬/끔별 DB 쿼리 수. 파라미터는 multiserver.load.*
	['loadtest', 'load.profile', 'load.subscribers', 'load.bidders', 'load.seconds', 'load.thinkMillis',
	 'load.poolSize', 'load.sweep', 'load.auctions', 'load.auctionSweep', 'load.precheck', 'load.priceReadAt', 'multiserver', 'multiserver.distributedLock',
	 'multiserver.load', 'multiserver.load.auctions', 'multiserver.load.bidders', 'multiserver.load.seconds',
	 'multiserver.load.thinkMillis', 'multiserver.load.priceReadAt'].each { key ->
		if (System.getProperty(key) != null) {
			systemProperty key, System.getProperty(key)
		}
	}
}
