plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		// [Java 25 = 최신 LTS] 18은 2022-09에 지원이 끝난 비 LTS라 보안 패치가 없다.
		//   Spring Boot 4.0.x·4.1.x 모두 Java 17~27을 지원한다. 25부터 sealed 타입 switch 패턴 매칭을 쓴다.
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

// [Mockito 에이전트] Java 21+는 테스트 중에 에이전트를 "동적으로" 붙이면 경고를 내고, 향후 JDK는 기본 차단한다.
//   그러면 @MockitoSpyBean 같은 인라인 목이 깨질 수 있다. Mockito 공식 권장대로 JVM 시작 시 -javaagent로 붙인다.
configurations {
	mockitoAgent
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// [캐시] Spring Cache 추상화(@Cacheable) + 저장소 Caffeine(서버 메모리).
	// 입찰 경로의 락 밖 조회(경매 ID, 사용자 요약)를 캐시해 DB 커넥션 획득을 줄인다. 설정은 CacheConfig.
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'com.github.ben-manes.caffeine:caffeine'
	implementation 'org.flywaydb:flyway-core'
	implementation 'com.github.f4b6a3:ulid-creator:5.2.3'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	implementation platform('software.amazon.awssdk:bom:2.28.16')
	implementation 'software.amazon.awssdk:s3'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	mockitoAgent('org.mockito:mockito-core') { transitive = false } // 버전은 Spring Boot BOM
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

}

tasks.named('test') {
	useJUnitPlatform()
	jvmArgs += "-javaagent:${configurations.mockitoAgent.asPath}"

	// [부하 테스트 스위치] HotAuctionLoadTest는 평소엔 건너뛴다(수십 초 걸림).
	// 돌릴 때만: ./gradlew.bat test --tests '*HotAuctionLoadTest*' -Dloadtest=true
	// 파라미터도 같은 방식으로 넘긴다: -Dload.subscribers=100 -Dload.bidders=20 -Dload.seconds=60
	// load.auctions(인기 경매 수) / load.auctionSweep(경매 수 스윕, 예: 1,3,5)도 같은 방식.
	// load.bidders / load.subscribers 는 "경매당" 값이다.
	['loadtest', 'load.profile', 'load.subscribers', 'load.bidders', 'load.seconds', 'load.thinkMillis',
	 'load.poolSize', 'load.sweep', 'load.auctions', 'load.auctionSweep'].each { key ->
		if (System.getProperty(key) != null) {
			systemProperty key, System.getProperty(key)
		}
	}
}
